name: Build Bitlify Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Make Gradlew Executable
        run: chmod +x gradlew || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            echo "Gradle wrapper not found, compiling with system gradle..."
            gradle assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_PATH=$(find . -name "*debug*.apk" -not -path "*/intermediates/*" | head -n 1)
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitlify-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path || 'app/build/outputs/apk/debug/*.apk' }}
          retention-days: 14

      - name: Job Summary
        run: |
          echo "### 🚀 Bitlify APK Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "The compiled debug APK is ready for download in the Artifacts section above." >> $GITHUB_STEP_SUMMARY
          echo "- **Architecture:** Jetpack Compose + Glassmorphism UI" >> $GITHUB_STEP_SUMMARY
          echo "- **Audio Features:** Hook-Drop & Dual-Deck Party Mix Mode enabled" >> $GITHUB_STEP_SUMMARY
