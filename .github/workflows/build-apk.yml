name: Build Bitlify Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Assemble Bitlify APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Fetch Upstream BitChord Base Engine
        run: |
          echo "Cloning core BitChord player & extractor engine..."
          git clone --depth 1 https://github.com/kushagrasinghx/BitChord.git base-bitchord
          
          # Copy base project build scripts and wrappers into root
          rsync -av --ignore-existing base-bitchord/ ./
          
          # Inject our Hook-Drop Party Mix and Glassmorphic UI directly into the app module
          mkdir -p app/src/main/java/com/music/bitchord/party
          mkdir -p app/src/main/java/com/music/bitchord/ui
          cp -rf src/main/kotlin/com/music/bitchord/party/* app/src/main/java/com/music/bitchord/party/ || true
          cp -rf src/main/kotlin/com/music/bitchord/ui/* app/src/main/java/com/music/bitchord/ui/ || true
          
          # Generate release keystore matching BitChord config (bitchord-release.jks with alias bitchord)
          keytool -genkey -v -keystore bitchord-release.jks -storepass android -alias bitchord -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Bitlify Release,O=Bitlify,C=US"
          
          # Configure build properties
          touch local.properties
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "LASTFM_API_KEY=" >> local.properties
          echo "LASTFM_SECRET=" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=https://bitchord-listen-together.onrender.com" >> local.properties
          
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=android"
            echo "keyAlias=bitchord"
            echo "keyPassword=android"
          } > keystore.properties

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Build APK
        run: |
          ./gradlew assembleProdRelease --no-daemon --stacktrace || ./gradlew assembleProdDebug --no-daemon --stacktrace || ./gradlew :app:assembleProdDebug --no-daemon --stacktrace

      - name: Locate Generated APK
        id: find_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk/ -name "*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -n 1)
          fi
          echo "Found APK: $APK_FILE"
          echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

      - name: Upload Bitlify APK Artifact
        uses: actions/upload-artifact@v4
        if: steps.find_apk.outputs.apk_path != ''
        with:
          name: Bitlify-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 14

      - name: Build Summary
        run: |
          echo "### 🚀 Bitlify APK Build Status" >> $GITHUB_STEP_SUMMARY
          echo "Build executed with Hook-Drop & Dual-Deck Party Mix Mode and Glassmorphic UI Redesign." >> $GITHUB_STEP_SUMMARY
